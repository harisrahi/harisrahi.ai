<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read what people say about learning AI with Haris Rahi and putting it to work in their teams.">
  <link rel="canonical" href="https://harisrahi.ai/testimonials">
  <title>Working with Haris on AI | Haris Rahi</title>
  <style>
    :root {
      --ink: #101412;
      --muted: #4f5a54;
      --paper: #f7f7f3;
      --bone: #f5f0e8;
      --line: #cfcfc5;
      --accent: #8b2f23;
      --serif: "Playfair Display", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --sans: "Hanken Grotesk", "Avenir Next", "Helvetica Neue", Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.55 var(--sans); }
    h1, h2, p, figure, blockquote { margin: 0; }
    .wrap { width: min(100%, 1180px); margin-inline: auto; padding-inline: clamp(22px, 5.2vw, 60px); }
    a { color: var(--accent); text-underline-offset: 0.25em; text-decoration-thickness: 1px; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    .skip { position: absolute; z-index: 11; inset: 0 auto auto 12px; padding: 12px; background: white; transform: translateY(-110%); }
    .skip:focus { transform: none; }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }
    .top, .closing { display: flex; align-items: center; justify-content: space-between; gap: 22px; }
    .top { min-height: 68px; }
    .brand { font: 700 1.12rem/1.2 var(--serif); text-decoration: none; color: var(--ink); }
    .back { color: var(--muted); font-size: .9rem; }
    .top a { display: inline-flex; align-items: center; min-height: 44px; }
    main { scroll-margin-top: 69px; }
    .opening { background: var(--bone); border-bottom: 1px solid var(--line); }
    .spread, .record { display: grid; grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr); column-gap: clamp(44px, 6vw, 88px); }
    .spread { padding-block: clamp(68px, 7vw, 104px); align-items: start; }
    h1, h2, blockquote { font-family: var(--serif); }
    h1 { font-size: clamp(2.6rem, 4.55vw, 3.6rem); line-height: 1.04; letter-spacing: -.03em; }
    h1 span { display: block; }
    .featured { border-top: 2px solid var(--accent); padding-top: 22px; }
    blockquote { text-wrap: pretty; }
    .featured blockquote { font-size: clamp(1.75rem, 2.65vw, 2.55rem); line-height: 1.18; letter-spacing: -.014em; }
    figcaption { margin-top: 16px; font-weight: 700; font-size: .95rem; color: var(--muted); }
    .record { padding-block: 36px; }
    .record + .record { border-top: 1px solid var(--line); }
    .record h2 { font-size: clamp(1.3rem, 1.7vw, 1.55rem); line-height: 1.22; font-weight: 600; }
    .record blockquote { font-size: clamp(1.27rem, 1.85vw, 1.6rem); line-height: 1.42; }
    .record figure + figure { margin-top: 30px; }
    .records { padding-block: 16px 26px; }
    .next { background: var(--ink); color: var(--paper); }
    .closing { padding-block: 40px; }
    .closing h2 { font-weight: 600; font-size: clamp(1.7rem, 3vw, 2.4rem); line-height: 1.13; text-wrap: balance; }
    .action { background: var(--bone); color: var(--ink); padding: 12px 21px; font-weight: 700; text-decoration: none; white-space: nowrap; }
    .action:hover { text-decoration: underline; }
    .next .action:focus-visible { outline-color: var(--paper); }
    footer { font-size: .83rem; color: var(--muted); }
    footer .wrap { padding-block: 20px; }
    @media (max-width: 730px) {
      .top { min-height: 58px; }
      main { scroll-margin-top: 59px; }
      .spread, .record { grid-template-columns: 1fr; }
      .spread { padding-block: 36px; gap: 30px; }
      h1 { font-size: clamp(2.65rem, 9vw, 3.5rem); }
      .featured { padding-top: 18px; }
      .featured blockquote { font-size: clamp(1.65rem, 5.8vw, 2.05rem); line-height: 1.25; }
      .records { padding-block: 2px 8px; }
      .record { padding-block: 26px; gap: 12px; }
      .record figure + figure { margin-top: 22px; }
      .record h2 { font: 700 .96rem/1.35 var(--sans); color: var(--accent); }
      figcaption { margin-top: 12px; }
      .closing { align-items: flex-start; flex-direction: column; padding-block: 30px; gap: 18px; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <nav class="wrap top" aria-label="Site">
      <a class="brand" href="/">Haris Rahi</a>
      <a class="back" href="/#colleague-note">Back to Approach</a>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <section class="opening" aria-labelledby="title">
      <div class="wrap spread">
        <h1 id="title"><span>Working with</span> Haris on AI</h1>
        <figure class="featured">
          <blockquote>“You make AI look easy, and you gave me that little nudge of confidence to try it out and incorporate it in my daily routine at work.”</blockquote>
          <figcaption>Smiljana S.</figcaption>
        </figure>
      </div>
    </section>
    <div class="wrap records">
      <section class="record">
        <h2>Learning to think with AI</h2>
        <div>
          <figure>
            <blockquote>“Your enthusiasm for AI made learning not only approachable but genuinely fun, and your ability to simplify complex ideas has left a lasting impact on me.”</blockquote>
            <figcaption>Stephanie P.</figcaption>
          </figure>
          <figure>
            <blockquote>“You taught me that coding and business rules isn't AI, it's about how we think and approach a problem and solve it […] That we need to think augmentation not automation of AI in process flows”</blockquote>
            <figcaption>Ruby S.</figcaption>
          </figure>
        </div>
      </section>
      <section class="record">
        <h2>Putting ideas to work</h2>
        <div>
          <figure>
            <blockquote>“Thank you so much for equipping me with the AI literacy that I leverage daily to drive high-impact results for our clients.”</blockquote>
            <figcaption>Gaurav M.</figcaption>
          </figure>
          <figure>
            <blockquote>“Thank you for encouraging me, and so many of our colleagues to challenge our thinking and be brave enough to try new things.”</blockquote>
            <figcaption>Monique S.</figcaption>
          </figure>
        </div>
      </section>
      <section class="record">
        <h2>Turning to a colleague for advice</h2>
        <div>
          <figure>
            <blockquote>“In Accenture whenever we discuss anything about AI and reinvention, your name always used to come for insights and support”</blockquote>
            <figcaption>Amal G.</figcaption>
          </figure>
        </div>
      </section>
    </div>
    <section class="next" aria-labelledby="next-title">
      <div class="wrap closing">
        <h2 id="next-title">Ready to invest in your people?</h2>
        <a class="action" href="/enquiry">Start a conversation</a>
      </div>
    </section>
  </main>
  <footer><div class="wrap">harisrahi.ai is operated by Helsingor LLC. © 2026 Helsingor LLC · <a href="/privacy">Privacy Notice</a></div></footer>
  <script>
    if (new URLSearchParams(location.search).get("from") === "proof") {
      const backLink = document.querySelector(".back");
      backLink.href = "/#proof";
      backLink.textContent = "Back to Proof";
    }
  </script>
</body>
</html>
